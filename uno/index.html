<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uno · Relaydo</title><link rel="stylesheet" href="../css/style.css"><script src="../js/theme.js"></script><link rel="stylesheet" href="uno.css"></head><body>
<header class="bar" id="bar"></header>
<main class="wrap">
 <section id="lobby" class="panel">
  <div id="choose"><h2>Play Uno</h2>
   <div class="row"><button id="host" class="primary">Host a game</button></div>
   <p class="status">…or join with an invite link:</p>
   <div class="row"><input type="text" id="myname" maxlength="16" placeholder="Your name (host and guests)"></div>
   <div class="row"><input type="text" id="joinlink" placeholder="Paste invite link"><button id="join">Join</button></div></div>
  <div id="invite-box" class="hidden"><div class="row"><input type="text" id="invite" readonly><button id="copy">Copy</button></div></div>
  <div class="row"><button id="start" class="primary hidden">Start game</button></div>
  <p class="status" id="status"></p><p class="status" id="relays"></p>
 </section>
 <section id="game" class="hidden"><div class="turn" id="gstatus"></div>
  <div id="plist" class="plist"></div>
  <div class="tablecard"><div id="topcard"></div></div>
  <div id="colors" class="row ctl hidden"></div>
  <div class="row ctl"><button id="deal" class="primary hidden">Start round</button><button id="draw" class="hidden">Draw</button><button id="pass" class="hidden">Pass</button></div>
  <h3>Your hand</h3><div id="hand" class="hand"></div>
 </section>
 <dialog id="rules"></dialog>
</main>
<script type="module" src="uno.js"></script></body></html>
